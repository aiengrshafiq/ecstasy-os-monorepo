# .github/workflows/deploy-frontend.yml

name: Deploy Frontend to Azure Storage

on:
  push:
    branches:
      - main
    paths:
      - 'apps/frontend-webapp/**'
  workflow_dispatch:

jobs:
  deploy-static-website:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout repository code'
        uses: actions/checkout@v4

      - name: 'Login to Azure CLI'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Step 1: Delete all existing files in the $web container for a clean deployment.
      # This ensures that any files you've deleted in your code are also removed from the server.
      - name: 'Clear existing static website files'
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az storage blob delete-batch --source '$web' --account-name ecstasyosfrontendstorage --connection-string '${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}'

      # Step 2 (CORRECTED): Use the core 'upload-batch' command to upload all new files.
      - name: 'Upload new files to Azure Blob Storage'
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az storage blob upload-batch --account-name ecstasyosfrontendstorage --destination '$web' --source ./apps/frontend-webapp --connection-string '${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}'

      - name: 'Azure logout'
        run: |
          az logout
          az cache purge
          az account clear
