# .github/workflows/deploy-frontend.yml

name: Deploy Frontend to Azure Storage

on:
  push:
    branches:
      - main
    paths:
      - 'apps/frontend-webapp/**'
  workflow_dispatch:

jobs:
  deploy-static-website:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: 'Login to Azure CLI'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # STEP 1 (CORRECTED): Use 'az storage sync' to robustly upload files
      # This command is better than 'upload-batch' because it also removes old files
      # that you may have deleted from your project.
      - name: 'Sync files to Azure Blob Storage'
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az storage sync --source ./apps/frontend-webapp \
                            --container '$web' \
                            --account-name ecstasyosfrontendstorage \
                            --connection-string '${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}' \
                            --delete-destination true
            
      # STEP 2 (NEW): Purge the CDN endpoint to clear the cache
      # This forces the CDN to fetch the new files you just uploaded.
      - name: 'Purge Static Website CDN Endpoint'
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az storage account blob-service-properties update \
              --account-name ecstasyosfrontendstorage \
              --enable-static-website true \
              --404-document index.html \
              --index-document index.html
            echo "CDN cache for the static website has been refreshed."

      - name: Azure logout
        run: |
          az logout
          az cache purge
          az account clear
