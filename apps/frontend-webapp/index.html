<!DOCTYPE html>
<html lang="en" class=""> <!-- The 'dark' class will be toggled here -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecstasy OS - HRMS</title>
    
    <!-- Tailwind CSS Script -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet Map Library -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- 
      THIS IS THE FIX:
      We define our custom component styles here using the 'text/tailwindcss' type.
      The Tailwind CDN script will see this and process it automatically.
    -->
    <style type="text/tailwindcss">
        @layer components {
            .input-field {
                @apply w-full px-4 py-2 bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg;
                @apply text-gray-900 dark:text-gray-100; /* Ensures text is visible */
                @apply focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent;
                @apply transition-colors duration-200;
            }
            .btn {
                @apply w-full flex items-center justify-center px-5 py-3 text-base font-medium rounded-lg;
                @apply focus:outline-none focus:ring-4;
                @apply transition-transform transform hover:scale-105;
            }
            .btn-primary {
                @apply text-white bg-blue-600 hover:bg-blue-700 focus:ring-blue-300 dark:focus:ring-blue-900;
            }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-200">

    <!-- Login View -->
    <div id="login-view" class="flex items-center justify-center min-h-screen p-4">
        <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-2xl shadow-lg dark:bg-gray-800">
            <div class="text-center">
                <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Ecstasy OS Login</h2>
                <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">Intelligent Operating System</p>
            </div>
            <form id="login-form" class="space-y-6">
                <div>
                    <label for="email-input" class="block mb-2 text-sm font-medium">Email</label>
                    <input type="email" id="email-input" class="input-field" placeholder="admin@company.com" required>
                </div>
                <div>
                    <label for="password-input" class="block mb-2 text-sm font-medium">Password</label>
                    <input type="password" id="password-input" class="input-field" placeholder="••••••••" required>
                </div>
                <p id="login-error" class="text-sm text-red-500 hidden"></p>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
        </div>
    </div>

    <!-- Main Application Shell -->
    <div id="app-shell" class="hidden">
        <div class="flex h-screen bg-gray-50 dark:bg-gray-900">
            <aside class="hidden lg:flex flex-col w-64 p-4 bg-white dark:bg-gray-800 border-r dark:border-gray-700">
                <div id="sidebar-content" class="flex flex-col h-full"></div>
            </aside>
            <main class="flex-1 flex flex-col overflow-hidden">
                <div class="p-4 lg:p-8 overflow-y-auto pb-20 lg:pb-8">
                    <div id="main-content"></div>
                </div>
            </main>
        </div>
        <nav class="lg:hidden fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-800 border-t dark:border-gray-700 flex p-2">
            <div id="mobile-nav" class="flex w-full justify-around"></div>
        </nav>
    </div>
    
    <script src="js/main.js"></script>
</body>
</html>
